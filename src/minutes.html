<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifelog — copy last…</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<form class="center" id="form">
  <label for="m">Copy the last how many minutes?</label>
  <input type="number" id="m" min="1" step="any" required autofocus>
  <button class="primary" type="submit">Copy as file</button>
  <span id="toast">&nbsp;</span>
</form>
<script>
"use strict";
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const minutes = parseFloat(document.getElementById("m").value);
  if (!(minutes > 0)) return;
  const body = JSON.stringify({ from: Date.now() / 1000 - minutes * 60 });
  const r = await (await fetch("/api/clip", { method: "POST", body })).json();
  document.getElementById("toast").textContent = r.error || `Copied ${r.lines} lines — paste anywhere`;
  if (!r.error) setTimeout(() => window.close(), 1200);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") window.close(); });
</script>
</body>
</html>
