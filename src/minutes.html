<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifelog copy last</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/app.css">
<script src="/icons.js"></script>
</head>
<body class="pop">
<div class="pop-head"><strong>Copy last</strong><button class="icon" id="close" title="Esc"><i data-icon="x"></i></button></div>
<form class="pop-body" id="form">
  <div class="amount">
    <input type="number" id="n" min="1" step="any" value="15" required autofocus>
    <div class="seg" id="unit">
      <label><input type="radio" name="unit" value="60" checked><span>min</span></label>
      <label><input type="radio" name="unit" value="3600"><span>h</span></label>
    </div>
  </div>
  <div class="preview" id="preview"></div>
  <div class="pop-foot">
    <span id="toast"></span>
    <button type="button" id="audio">Copy audio</button>
    <button class="primary" type="submit">Copy</button>
  </div>
</form>
<script>
"use strict";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hm = ts => { const d = new Date(ts * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const closeWin = () => window.ipc ? window.ipc.postMessage("close") : window.close();
const unit = () => +document.querySelector('input[name="unit"]:checked').value;
const start = () => { const n = parseFloat($("n").value); return n > 0 ? Date.now() / 1000 - n * unit() : null; };
try { const u = localStorage.getItem("unit"); if (u) document.querySelector(`input[name="unit"][value="${u}"]`).checked = true; } catch { }

// The conversation around where the copy would start.
let ticket = 0, timer = null;
async function preview() {
  const from = start(), mine = ++ticket;
  if (from === null) { $("preview").innerHTML = ""; return; }
  const [b, a] = await Promise.all([
    fetch(`/api/lines?before=${from}&limit=3`).then(r => r.json()),
    fetch(`/api/lines?after=${from}&limit=12`).then(r => r.json()),
  ]);
  if (mine !== ticket) return;
  const line = (l, cls) => `<div class="p ${cls} ${l.source === "mic" ? "me" : ""}"><span class="t">${hm(l.start_ts)}</span><span>${esc(l.text)}</span></div>`;
  $("preview").innerHTML = (b.lines || []).map(l => line(l, "before")).join("") +
    `<div class="start">${hm(from)}</div>` +
    ((a.lines || []).map(l => line(l, "")).join("") || `<div class="p"><span></span><span class="hint">Nothing since</span></div>`);
  $("preview").querySelector(".start").scrollIntoView({ block: "start" });
}
const later = () => { clearTimeout(timer); timer = setTimeout(preview, 120); };
$("n").addEventListener("input", later);
$("unit").addEventListener("change", () => { try { localStorage.setItem("unit", unit()); } catch { } later(); });
preview();
$("n").select();

async function copy(as) {
  const from = start(); if (from === null) return;
  $("toast").textContent = as === "audio" ? "Cutting…" : "";
  const r = await (await fetch("/api/clip", { method: "POST", body: JSON.stringify({ from, as }) })).json();
  $("toast").textContent = r.error || (as === "audio" ? `Copied ${Math.round(r.seconds)} s of audio` : `Copied ${r.lines} lines`);
  if (!r.error) setTimeout(closeWin, 900);
}
$("form").addEventListener("submit", e => { e.preventDefault(); copy("file"); });
$("audio").addEventListener("click", () => copy("audio"));
$("close").addEventListener("click", closeWin);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeWin(); });
// Clicking anywhere else closes it, like a menu.
window.addEventListener("blur", () => setTimeout(() => { if (!document.hasFocus()) closeWin(); }, 150));
</script>
</body>
</html>
