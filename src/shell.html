<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifelog app</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/app.css">
<script src="/icons.js"></script>
</head>
<body>
<nav class="tabs" id="tabs">
  <img src="/logo.svg" alt="" width="20" height="20">
  <button data-tab="ui"><i data-icon="scroll-text"></i>Browser</button>
  <button data-tab="summary"><i data-icon="calendar-days"></i>Your days</button>
  <button data-tab="settings"><i data-icon="settings"></i>Settings</button>
</nav>
<div class="frames" id="frames"></div>
<script>
"use strict";
// Each tab is its own page in a frame, kept loaded so switching back keeps its place.
const frames = {};
function open(target) {
  const [tab, query] = target.split("?");
  if (!["ui", "summary", "settings"].includes(tab)) return;
  let f = frames[tab];
  if (!f) {
    f = frames[tab] = document.createElement("iframe");
    f.src = `/${tab}${query ? "?" + query : ""}`;
    document.getElementById("frames").append(f);
  } else if (query) {
    f.src = `/${tab}?${query}`;
  }
  Object.entries(frames).forEach(([k, e]) => e.classList.toggle("on", k === tab));
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("sel", b.dataset.tab === tab));
  f.contentWindow?.focus();
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) open(b.dataset.tab); });
// The tray (or a notification) asks for a tab through the app.
async function nav() {
  try {
    const r = await (await fetch("/api/nav")).json();
    if (r.tab) open(r.tab);
  } catch { }
}
nav().then(() => { if (!Object.keys(frames).length) open("ui"); });
setInterval(nav, 400);
</script>
</body>
</html>
