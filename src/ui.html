<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifelog</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <div class="row">
    <span class="label">Range</span><input type="datetime-local" id="from" title="Start of the range">
    <span class="label" style="min-width:0">to</span><input type="datetime-local" id="to" title="End of the range (empty = now)">
    <button class="small" id="clear" title="Clear the range (Esc)">Clear</button>
    <span class="nav"><a href="/summary">Your days</a> · <a href="/settings">Settings</a></span>
  </div>
  <div class="row">
    <span class="label">Find</span>
    <div class="find">
      <input type="search" id="q" placeholder="A word or phrase you remember…" autocomplete="off">
      <div id="results"></div>
    </div>
  </div>
  <div class="row" id="speakers"></div>
</header>
<main id="lines"></main>
<footer>
  <span id="summary"></span>
  <span id="toast"></span>
  <button class="small" id="to-end" title="Back to now">↓ Now</button>
  <button id="copy-audio" title="The audio of the range as a .wav (last 7 days)">Copy audio</button>
  <button id="copy-text">Copy text</button>
  <button class="primary" id="copy-file" title="Ctrl+Enter">Copy as file</button>
</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clock = ts => { const d = new Date(ts * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const midnight = daysAgo => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() / 1000 - daysAgo * 86400; };
const nowTs = () => Date.now() / 1000;
const inputValue = ts => {
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const dayKey = ts => new Date(ts * 1000).toDateString();
function day(ts) {
  const days = Math.round((midnight(0) - new Date(ts * 1000).setHours(0, 0, 0, 0) / 1000) / 86400);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  return new Date(ts * 1000).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}
const longDay = ts => new Date(ts * 1000).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
function duration(secs) {
  const m = Math.round(secs / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
const size = b => b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.ceil(b / 1e3) + " KB";
const get = async url => (await fetch(url)).json();

// The loaded stretch of the timeline: lines and pasted files, oldest first.
const view = { lines: [], files: [], moreBefore: true, moreAfter: false, busy: false };
// range = { from, to } (to null = up to now) or null. anchor = the line Shift+click extends from.
let range = null, anchor = null, selected = null, playing = null;
const excluded = new Set();
const AUDIO_DAYS = 7;

const items = () => [
  ...view.lines.filter(l => !excluded.has(l.speaker)).map(l => ({ ts: l.start_ts, end: l.end_ts, line: l })),
  ...view.files.map(f => ({ ts: f.ts, end: f.ts, file: f })),
].sort((a, b) => a.ts - b.ts);

function itemHtml(it, prev) {
  let html = "";
  if (!prev || dayKey(prev.ts) !== dayKey(it.ts)) html += `<div class="dayh" data-day="${dayKey(it.ts)}">${longDay(it.ts)}</div>`;
  else if (it.ts - prev.end > 300) html += `<div class="gap">— ${duration(it.ts - prev.end)} of nothing —</div>`;
  if (it.file) {
    const f = it.file, src = `/api/file?id=${f.id}`;
    const body = f.kind === "image" ? `<a href="${src}" target="_blank"><img src="${src}" loading="lazy" alt="${esc(f.name)}"></a>`
      : f.kind === "video" ? `<video controls preload="metadata" src="${src}"></video>`
      : f.kind === "audio" ? `<audio controls preload="none" src="${src}"></audio>`
      : f.kind === "text" ? `<pre>${esc(f.text || "")}</pre>` : "";
    return html + `<div class="f" data-ts="${f.ts}"><span></span><span class="t">${clock(f.ts)}</span><span class="w">pasted</span>` +
      `<div><div class="fname">${esc(f.name)} <small>${size(f.size)}</small>` +
      `<button class="small" data-open="${f.id}">Open</button><button class="small" data-folder="${f.id}">Show in folder</button></div>${body}</div></div>`;
  }
  const l = it.line;
  const who = l.source !== "mic" && l.title ? `${l.speaker} · ${l.title}` : l.speaker;
  const playable = l.audio && l.start_ts > nowTs() - AUDIO_DAYS * 86400;
  const play = playable ? `<button class="play" data-play="${l.id}" title="Play (Space)">▶</button>` : "";
  return html + `<div class="l ${l.source === "mic" ? "me" : ""}" data-id="${l.id}" data-ts="${l.start_ts}" data-end="${l.end_ts}">` +
    `<span>${play}</span><span class="t">${clock(l.start_ts)}</span><span class="w" title="${esc(who)}">${esc(who)}</span><span>${esc(l.text)}</span></div>`;
}
const chunkHtml = (list, prev) => list.map((it, i) => itemHtml(it, i ? list[i - 1] : prev)).join("");

function renderAll() {
  const all = items();
  $("lines").innerHTML = chunkHtml(all, null) ||
    `<div class="empty">${view.lines.length ? "Everything here is from speakers you switched off." : "Nothing transcribed yet."}</div>`;
  marks();
  speakers();
}

// Merges new lines/files in; returns the ones that were not loaded yet.
function merge(r) {
  const have = new Set(view.lines.map(l => l.id)), haveF = new Set(view.files.map(f => f.id));
  const lines = (r.lines || []).filter(l => !have.has(l.id)), files = (r.files || []).filter(f => !haveF.has(f.id));
  view.lines.push(...lines); view.files.push(...files);
  view.lines.sort((a, b) => a.start_ts - b.start_ts || a.id - b.id);
  view.files.sort((a, b) => a.ts - b.ts);
  return [
    ...lines.filter(l => !excluded.has(l.speaker)).map(l => ({ ts: l.start_ts, end: l.end_ts, line: l })),
    ...files.map(f => ({ ts: f.ts, end: f.ts, file: f })),
  ].sort((a, b) => a.ts - b.ts);
}

const main = $("lines");
const atBottom = () => main.scrollHeight - main.scrollTop - main.clientHeight < 60;

async function loadLatest() {
  const r = await get(`/api/lines?before=${nowTs() + 1}&limit=300`);
  view.lines = []; view.files = [];
  merge(r);
  view.moreBefore = r.more; view.moreAfter = false;
  renderAll();
  main.scrollTop = main.scrollHeight;
}

async function loadOlder() {
  if (view.busy || !view.moreBefore || !view.lines.length) return;
  view.busy = true;
  try {
    const r = await get(`/api/lines?before=${view.lines[0].start_ts}&limit=300`);
    view.moreBefore = r.more;
    const all = items(), first = all[0];
    const added = merge(r).filter(it => !first || it.ts <= first.ts);
    if (!added.length) return;
    const height = main.scrollHeight;
    // The old first item's day header goes if the new chunk ends on the same day.
    const head = main.firstElementChild;
    if (head?.classList.contains("dayh") && head.dataset.day === dayKey(added[added.length - 1].ts)) head.remove();
    let html = chunkHtml(added, null);
    if (first && dayKey(first.ts) === dayKey(added[added.length - 1].ts) && first.ts - added[added.length - 1].end > 300)
      html += `<div class="gap">— ${duration(first.ts - added[added.length - 1].end)} of nothing —</div>`;
    main.insertAdjacentHTML("afterbegin", html);
    main.scrollTop += main.scrollHeight - height;
    marks(); speakers();
  } finally { view.busy = false; }
}

async function loadNewer() {
  if (view.busy) return;
  const last = view.lines[view.lines.length - 1];
  if (!last) return loadLatest();
  view.busy = true;
  try {
    const r = await get(`/api/lines?after=${last.start_ts}&limit=300`);
    view.moreAfter = r.more;
    const stick = atBottom() && !view.moreAfter;
    const before = items().filter(it => it.ts <= last.start_ts);
    const added = merge(r);
    if (!added.length) return;
    main.querySelector(".empty")?.remove();
    main.insertAdjacentHTML("beforeend", chunkHtml(added, before[before.length - 1]));
    if (stick) main.scrollTop = main.scrollHeight;
    marks(); speakers();
  } finally { view.busy = false; }
}

// Shows the timeline around `ts` (a search hit, or the start of a range).
async function jumpTo(ts, pick) {
  const [b, a] = await Promise.all([get(`/api/lines?before=${ts + 0.001}&limit=80`), get(`/api/lines?after=${ts}&limit=300`)]);
  view.lines = []; view.files = [];
  merge(b); merge(a);
  view.moreBefore = b.more; view.moreAfter = a.more;
  if (pick !== undefined) { selected = anchor = pick; }
  renderAll();
  const target = [...main.querySelectorAll(".l, .f")].find(e => +e.dataset.ts >= ts - 0.01);
  target?.scrollIntoView({ block: "center" });
  if (target) { target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 1500); }
}

// Images and videos load after the scroll position was set; stay at the live end if we were there.
let pinned = true;
main.addEventListener("load", () => { if (pinned && !view.moreAfter) main.scrollTop = main.scrollHeight; }, true);
main.addEventListener("loadedmetadata", () => { if (pinned && !view.moreAfter) main.scrollTop = main.scrollHeight; }, true);
main.addEventListener("scroll", () => {
  pinned = atBottom();
  if (main.scrollTop < 400) loadOlder();
  if (view.moreAfter && main.scrollHeight - main.scrollTop - main.clientHeight < 400) loadNewer();
  $("to-end").style.visibility = view.moreAfter || !atBottom() ? "visible" : "hidden";
});
$("to-end").addEventListener("click", () => view.moreAfter ? loadLatest() : (main.scrollTop = main.scrollHeight));

// Selection, range and playing are shown with classes, so videos and scroll stay put.
function marks() {
  const to = range ? (range.to ?? Infinity) : 0;
  main.querySelectorAll(".l").forEach(e => {
    const id = +e.dataset.id;
    e.classList.toggle("picked", id === selected);
    e.classList.toggle("inr", !!range && +e.dataset.end >= range.from && +e.dataset.ts <= to);
    const p = e.querySelector(".play");
    if (p) { p.classList.toggle("on", id === playing); p.textContent = id === playing ? "■" : "▶"; }
  });
  $("from").value = range ? inputValue(range.from) : "";
  $("to").value = range && range.to !== null ? inputValue(range.to) : "";
  ["copy-audio", "copy-text", "copy-file"].forEach(id => { $(id).disabled = !range; });
  if (!range) {
    $("summary").textContent = "Click a line, then Shift+click another to pick a range to copy.";
  } else {
    const to = range.to ?? nowTs();
    const n = view.lines.filter(l => !excluded.has(l.speaker) && l.end_ts >= range.from && l.start_ts <= to).length;
    $("summary").textContent = `${n} lines · ${day(range.from)} ${clock(range.from).slice(0, 5)} → ` +
      (range.to === null ? "now" : `${dayKey(range.from) === dayKey(to) ? "" : day(to) + " "}${clock(to).slice(0, 5)}`);
  }
}

function speakers() {
  const list = [...new Set(view.lines.map(l => l.speaker))];
  $("speakers").innerHTML = list.length < 2 ? "" : `<span class="label">Show</span>` + list.map(s =>
    `<button class="small ${excluded.has(s) ? "off" : ""}" data-speaker="${esc(s)}">${esc(s)}</button>`).join("");
}
$("speakers").addEventListener("click", e => {
  const s = e.target.closest("button")?.dataset.speaker; if (s === undefined) return;
  excluded.has(s) ? excluded.delete(s) : excluded.add(s);
  renderAll();
});

// Range
function setRange(r) { range = r; marks(); }
$("from").addEventListener("change", e => {
  if (!e.target.value) return setRange(null);
  const from = new Date(e.target.value).getTime() / 1000;
  setRange({ from, to: range?.to ?? null });
  jumpTo(from);
});
$("to").addEventListener("change", e => {
  const to = e.target.value ? new Date(e.target.value).getTime() / 1000 + 59 : null;
  setRange({ from: range?.from ?? (to ?? nowTs()) - 3600, to });
});
$("clear").addEventListener("click", () => { anchor = null; setRange(null); });

// Clicking a line selects it (Space plays it); Shift+click makes a range from the selected line.
main.addEventListener("click", e => {
  const p = e.target.closest("[data-play]");
  if (p) { selected = anchor = +p.dataset.play; play(selected); return; }
  const o = e.target.closest("[data-open]"), f = e.target.closest("[data-folder]");
  if (o || f) {
    fetch(`/api/file-open?id=${(o || f).dataset[o ? "open" : "folder"]}${f ? "&folder=1" : ""}`, { method: "POST" })
      .then(r => r.json()).then(r => { if (r.error) toast(r.error); });
    return;
  }
  const l = e.target.closest(".l"); if (!l || getSelection().toString()) return;
  const id = +l.dataset.id;
  if (e.shiftKey && anchor !== null) {
    const a = view.lines.find(x => x.id === anchor), b = view.lines.find(x => x.id === id);
    if (a && b) setRange({ from: Math.min(a.start_ts, b.start_ts) - 0.5, to: Math.max(a.end_ts, b.end_ts) + 0.5 });
    selected = id;
  } else {
    selected = anchor = id;
  }
  marks();
});

// Playing a line's audio (kept for a week).
const player = new Audio();
function play(id) {
  if (playing === id) { player.pause(); playing = null; marks(); return; }
  player.src = `/api/audio?id=${id}`;
  player.play().catch(() => toast("That audio is gone (kept for a week)."));
  playing = id; marks();
}
player.addEventListener("ended", () => { playing = null; marks(); });
player.addEventListener("error", () => { if (playing !== null) { toast("That audio is gone (kept for a week)."); playing = null; marks(); } });
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === " " && selected !== null) { e.preventDefault(); play(selected); }
  if (e.key === "Escape") { anchor = null; setRange(null); }
});

// Find a phrase → jump there
let hits = [], active = 0, searching = 0;
function showHits(q) {
  const words = q.trim().split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const re = words.length ? new RegExp("(" + words.join("[^\\p{L}\\p{N}]+") + ")", "giu") : null;
  $("results").innerHTML = hits.length
    ? hits.map((l, i) => `<div class="hit ${i === active ? "active" : ""}" data-i="${i}">` +
        `<div class="when">${day(l.start_ts)} ${clock(l.start_ts)} · ${esc(l.speaker)}${l.source !== "mic" && l.title ? " · " + esc(l.title) : ""}</div>` +
        `<div>${re ? esc(l.text).replace(re, "<mark>$1</mark>") : esc(l.text)}</div></div>`).join("")
    : `<div class="none">No line contains that phrase.</div>`;
}
$("q").addEventListener("input", async e => {
  const q = e.target.value, ticket = ++searching;
  if (!q.trim()) { hits = []; $("results").innerHTML = ""; return; }
  const data = await get(`/api/search?q=${encodeURIComponent(q)}`);
  if (ticket !== searching) return;
  hits = data.lines || []; active = 0;
  showHits(q);
});
function pick(i) {
  const l = hits[i]; if (!l) return;
  $("results").innerHTML = "";
  jumpTo(l.start_ts, l.id);
}
$("results").addEventListener("mousedown", e => { const h = e.target.closest(".hit"); if (h) pick(+h.dataset.i); });
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter") { pick(active); e.preventDefault(); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    active = Math.max(0, Math.min(hits.length - 1, active + (e.key === "ArrowDown" ? 1 : -1)));
    showHits($("q").value);
    $("results").querySelector(".active")?.scrollIntoView({ block: "nearest" });
    e.preventDefault();
  } else if (e.key === "Escape") $("results").innerHTML = "";
});
$("q").addEventListener("blur", () => setTimeout(() => { $("results").innerHTML = ""; }, 150));
$("q").addEventListener("focus", e => { if (hits.length && e.target.value.trim()) showHits(e.target.value); });

// Copy the range
function toast(text) {
  $("toast").textContent = text;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { $("toast").textContent = ""; }, 4000);
}
async function copy(as) {
  if (!range) return toast("Pick a range first.");
  const body = { from: range.from, to: range.to, exclude: [...excluded], as };
  const r = await (await fetch("/api/clip", { method: "POST", body: JSON.stringify(body) })).json();
  if (r.error) return toast(r.error);
  if (as === "audio") return toast(`Copied ${r.seconds < 60 ? r.seconds + " s" : duration(r.seconds)} of audio — paste anywhere`);
  if (as === "text") await navigator.clipboard.writeText(r.text);
  toast(`Copied ${r.lines} lines${as === "file" ? " as a file" : ""} — paste anywhere`);
}
$("copy-file").addEventListener("click", () => copy("file"));
$("copy-text").addEventListener("click", () => copy("text"));
$("copy-audio").addEventListener("click", e => {
  e.target.disabled = true;
  toast("Cutting the audio…");
  copy("audio").finally(() => { e.target.disabled = !range; });
});
document.addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") copy("file"); });

// At the live end, new lines (and pastes) appear as they come in.
setInterval(() => { if (!view.moreAfter && !document.hidden) loadNewer(); }, 5000);
loadLatest();
</script>
</body>
</html>
