<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifelog settings</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/app.css">
<script src="/icons.js"></script>
</head>
<body>
<div class="page">
  <section class="card">
    <div class="set"><span>Recording</span><input type="checkbox" class="switch" id="rec"></div>
  </section>

  <section class="card">
    <h2>Apps <span class="right"><a href="#" id="show-dismissed" hidden></a> &nbsp; <a href="#" id="edit-apps">Edit list</a></span></h2>
    <div id="apps"></div>
    <div class="pager" id="apps-pager"></div>
  </section>

  <section class="card">
    <h2>Games <a href="#" id="edit-games" class="right">Edit list</a></h2>
    <div id="games"></div>
    <form class="add" id="add-game"><input type="text" id="game-name" placeholder="eldenring.exe"><button>Add game</button></form>
  </section>

  <section class="card">
    <h2>Transcription <small id="tr-state"></small></h2>
    <div class="seg" id="mode">
      <label title="Waits during games"><input type="radio" name="mode" value="auto"><span>Auto</span></label>
      <label><input type="radio" name="mode" value="always"><span>Always</span></label>
      <label><input type="radio" name="mode" value="paused"><span>Paused</span></label>
    </div>
    <div class="set"><span>GPU load that counts as gaming <small id="gpu-now"></small></span>
      <span><input type="number" id="limit" min="1" max="100"> %</span></div>
  </section>

  <section class="card">
    <h2>Daily summary <small id="sum-state"></small></h2>
    <div class="set"><span>Ask each evening</span><input type="checkbox" class="switch" id="sum-on"></div>
    <div class="set"><span>Time</span><input type="time" id="sum-at"></div>
    <div class="set"><span>Max words</span><input type="number" id="sum-words" min="50" max="2000" step="10"></div>
    <div class="set" style="border:0;padding-bottom:2px"><span>Never mention</span></div>
    <div id="never"></div>
    <div class="row" style="margin-top:10px"><button id="sum-now">Write today's now</button></div>
  </section>

  <section class="card">
    <h2>Files</h2>
    <div class="row">
      <button data-open="data"><i data-icon="folder-open"></i>Data</button>
      <button data-open="log"><i data-icon="file-text"></i>Log</button>
      <button data-open="config"><i data-icon="file-text"></i>Config</button>
    </div>
  </section>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const name = exe => exe.replace(/\.exe$/i, "");
const enc = encodeURIComponent;
const post = async url => show(await (await fetch(url, { method: "POST" })).json());
const typing = el => document.activeElement === el;
const ago = ts => {
  if (!ts) return "";
  const m = (Date.now() / 1000 - ts) / 60;
  return m < 2 ? "now" : m < 60 ? `${Math.round(m)} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago`
    : new Date(ts * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" });
};
const btn = (icon_, attrs, title, on = false) => `<button class="icon ${on ? "on" : ""}" ${attrs} title="${title}">${icon(icon_)}</button>`;
const set = (label, extra, acts) => `<div class="set"><span>${esc(label)}${extra}</span><span class="acts">${acts}</span></div>`;
const row = (label, attrs, on, extra = "", acts = "") =>
  set(label, extra, acts + `<input type="checkbox" class="switch" ${attrs} ${on ? "checked" : ""}>`);
let editGames = false, last = null;

// Apps: normally the ones playing now. "Edit list" pages through every app heard, 10 at a time;
// dismissing one stops recording it and hides it (what it already has stays).
const apps = { edit: false, dismissed: false, page: 0 };
const appActs = (a, locked) => a.dismissed
  ? btn("rotate-ccw", `data-restore-app="${esc(a.exe)}"`, "Record again")
  : btn(locked ? "lock" : "lock-open", `data-lock="${esc(a.exe)}"`, locked ? "Locked: always recorded" : "Lock", locked) +
    (locked ? "" : btn("x", `data-dismiss-app="${esc(a.exe)}"`, "Dismiss"));
function showApps() {
  if (apps.edit || !last) return;
  const s = last, locked = s.locked_apps;
  const playing = [...new Set(s.streams.map(x => x.exe).filter(Boolean).map(e => e.toLowerCase()))].filter(e => !s.excluded_apps.includes(e));
  $("apps").innerHTML = playing.map(e => set(name(e), ` <small>playing</small>`, appActs({ exe: e }, locked.includes(e)))).join("") ||
    `<p class="note">Nothing playing</p>`;
  $("apps-pager").innerHTML = "";
}
async function loadApps() {
  if (!apps.edit) return showApps();
  const r = await (await fetch(`/api/apps?page=${apps.page}&dismissed=${apps.dismissed ? 1 : 0}`)).json();
  if (r.page >= r.pages && apps.page > 0) { apps.page = r.pages - 1; return loadApps(); }
  $("apps").innerHTML = r.apps.map(a => set(name(a.exe),
    ` <small>${a.playing ? "playing" : ago(a.last_ts)}</small>`, appActs({ ...a, dismissed: apps.dismissed }, a.locked))).join("") ||
    `<p class="note">${apps.dismissed ? "None dismissed" : "None"}</p>`;
  $("apps-pager").innerHTML = r.pages > 1
    ? btn("chevron-left", `data-page="-1" ${r.page === 0 ? "disabled" : ""}`, "Previous") + `${r.page + 1} / ${r.pages}` +
      btn("chevron-right", `data-page="1" ${r.page + 1 >= r.pages ? "disabled" : ""}`, "Next")
    : "";
  $("show-dismissed").textContent = apps.dismissed ? "Show heard" : `Show dismissed (${r.dismissed_count})`;
}
function setAppsMode() {
  $("edit-apps").textContent = apps.edit ? "Done" : "Edit list";
  $("show-dismissed").hidden = !apps.edit;
  loadApps();
}
$("edit-apps").addEventListener("click", e => { e.preventDefault(); apps.edit = !apps.edit; apps.dismissed = false; apps.page = 0; setAppsMode(); });
$("show-dismissed").addEventListener("click", e => { e.preventDefault(); apps.dismissed = !apps.dismissed; apps.page = 0; loadApps(); });
$("apps-pager").addEventListener("click", e => { const b = e.target.closest("[data-page]"); if (b) { apps.page += +b.dataset.page; loadApps(); } });
$("apps").addEventListener("click", async e => {
  const l = e.target.closest("[data-lock]"), d = e.target.closest("[data-dismiss-app]"), r = e.target.closest("[data-restore-app]");
  if (l) await post(`/lock?app=${enc(l.dataset.lock)}&on=${l.classList.contains("on") ? 0 : 1}`);
  if (d) await post(`/exclude?app=${enc(d.dataset.dismissApp)}`);
  if (r) await post(`/include?app=${enc(r.dataset.restoreApp)}`);
  if (l || d || r) loadApps();
});

function show(s) {
  if (s.error) return alert(s.error);
  last = s;
  $("rec").checked = !s.paused;
  showApps();

  // Games: marked ones, then open apps not dismissed. "Edit list" also shows the dismissed ones.
  const candidates = s.running_apps.filter(e => !s.games.includes(e) && !s.not_games.includes(e));
  const tag = e => s.game_running === e ? ` <small>running</small>` : "";
  let html = s.games.map(e => row(name(e), `data-game="${esc(e)}"`, true, tag(e))).join("") +
    candidates.map(e => row(name(e), `data-game="${esc(e)}"`, false, "", btn("x", `data-dismiss="${esc(e)}"`, "Not a game"))).join("");
  if (editGames) {
    html += s.not_games.map(e => set(name(e), ` <small>dismissed</small>`, btn("rotate-ccw", `data-restore="${esc(e)}"`, "Suggest again"))).join("");
  }
  $("games").innerHTML = html || `<p class="note">No new apps open</p>`;
  $("edit-games").textContent = editGames ? "Done" : "Edit list";

  const t = s.transcription;
  document.querySelectorAll('input[name="mode"]').forEach(r => { r.checked = r.value === t.mode; });
  const queue = s.queued_minutes >= 1 ? `${Math.round(s.queued_minutes)} min queued` : "up to date";
  $("tr-state").textContent = `${t.state} · ${queue}`;
  if (!typing($("limit"))) $("limit").value = s.gpu_busy_percent;
  $("gpu-now").textContent = `now ${s.gpu_3d_percent} %`;

  const sum = s.summary;
  $("sum-on").checked = sum.enabled;
  if (!typing($("sum-at"))) $("sum-at").value = sum.ask_at;
  if (!typing($("sum-words"))) $("sum-words").value = sum.max_words;
  const busy = /reading|writing|waiting|starting/.test(sum.state);
  $("sum-state").textContent = busy ? sum.state + "…" : ({ done: "today's done", skipped: "skipped today" }[sum.today_status] || "");
}

$("rec").addEventListener("change", e => post(e.target.checked ? "/resume" : "/pause"));
$("add-game").addEventListener("submit", e => {
  e.preventDefault();
  let app = $("game-name").value.trim(); if (!app) return;
  if (!/\.[a-z0-9]+$/i.test(app)) app += ".exe";
  $("game-name").value = "";
  post(`/game?app=${enc(app)}`);
});
$("games").addEventListener("click", e => {
  const d = e.target.closest("[data-dismiss]"), r = e.target.closest("[data-restore]");
  if (d) post(`/dismiss-game?app=${enc(d.dataset.dismiss)}`);
  if (r) post(`/dismiss-game?app=${enc(r.dataset.restore)}&on=0`);
});
$("games").addEventListener("change", e => {
  const app = e.target.dataset.game; if (!app) return;
  post(`/${e.target.checked ? "game" : "not-game"}?app=${enc(app)}`);
});
$("edit-games").addEventListener("click", e => { e.preventDefault(); editGames = !editGames; if (last) show(last); });

const showNever = r => {
  $("never").innerHTML = (r.never || []).map(n =>
    `<span class="chip">${esc(n.topic)}<button data-never="${n.id}" title="Allow again">${icon("x")}</button></span>`).join("") ||
    `<p class="note">None</p>`;
};
$("never").addEventListener("click", async e => {
  const b = e.target.closest("[data-never]"); if (!b) return;
  showNever(await (await fetch(`/api/summary-never?remove=${b.dataset.never}`, { method: "POST" })).json());
});
fetch("/api/summary-never").then(r => r.json()).then(showNever);

document.querySelectorAll('input[name="mode"]').forEach(r =>
  r.addEventListener("change", () => post(`/transcription?mode=${r.value}`)));
$("limit").addEventListener("change", e => {
  const v = Math.round(+e.target.value);
  if (v >= 1 && v <= 100) post(`/api/gpu-limit?percent=${v}`);
});
const sumSet = q => post(`/api/summary-settings?${q}`);
$("sum-on").addEventListener("change", e => sumSet(`enabled=${e.target.checked ? 1 : 0}`));
$("sum-at").addEventListener("change", e => { if (e.target.value) sumSet(`ask_at=${enc(e.target.value)}`); });
$("sum-words").addEventListener("change", e => { const v = Math.round(+e.target.value); if (v >= 50) sumSet(`max_words=${v}`); });
$("sum-now").addEventListener("click", () => fetch("/summary?do=now", { method: "POST" }));
document.querySelectorAll("[data-open]").forEach(b =>
  b.addEventListener("click", () => fetch(`/api/open?what=${b.dataset.open}`, { method: "POST" })));

const refresh = async () => { if (!document.hidden) show(await (await fetch("/status")).json()); };
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
