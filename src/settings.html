<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifelog — settings</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <div class="row"><img src="/logo.svg" alt="" width="22" height="22"><strong>Settings</strong>
    <span class="nav"><a href="/ui">Transcript</a> · <a href="/summary">Your days</a></span></div>
</header>
<div class="page">
  <section class="card">
    <div class="set"><span>Recording <small id="hotkey"></small></span><input type="checkbox" class="switch" id="rec"></div>
  </section>

  <section class="card">
    <h2>Apps</h2>
    <p class="note">Off = never recorded, and its history is deleted.</p>
    <div id="apps"></div>
    <form class="add" id="add-app"><input type="text" id="app-name" placeholder="Exclude an app, e.g. vlc.exe"><button>Exclude</button></form>
  </section>

  <section class="card">
    <h2>Games</h2>
    <p class="note">On = no transcribing while it runs (still records).</p>
    <div id="games"></div>
    <form class="add" id="add-game"><input type="text" id="game-name" placeholder="Add a game, e.g. eldenring.exe"><button>Add</button></form>
  </section>

  <section class="card">
    <h2>Transcription <small id="tr-state"></small></h2>
    <div class="seg" id="mode">
      <label><input type="radio" name="mode" value="auto"><span>Auto</span></label>
      <label><input type="radio" name="mode" value="always"><span>Always</span></label>
      <label><input type="radio" name="mode" value="paused"><span>Paused</span></label>
    </div>
    <p class="note" id="mode-note"></p>
    <div class="set"><span>Count GPU load above this as a game <small id="gpu-now"></small></span>
      <span><input type="number" id="limit" min="1" max="100"> %</span></div>
  </section>

  <section class="card">
    <h2>Daily summary <small id="sum-state"></small></h2>
    <div class="set"><span>Ask each evening</span><input type="checkbox" class="switch" id="sum-on"></div>
    <div class="set"><span>Time</span><input type="time" id="sum-at"></div>
    <div class="set"><span>Max words</span><input type="number" id="sum-words" min="50" max="2000" step="10"></div>
    <div class="row" style="margin-top:10px"><button id="sum-now">Write today's now</button><a href="/summary">Read your days</a></div>
  </section>

  <section class="card">
    <h2>Files</h2>
    <div class="row"><button data-open="data">Data folder</button><button data-open="log">Log</button><button data-open="config">Config file</button></div>
  </section>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const name = exe => exe.replace(/\.exe$/i, "");
const post = async url => show(await (await fetch(url, { method: "POST" })).json());
const typing = el => document.activeElement === el;
const MODE_NOTES = {
  auto: "Waits during games, then catches up.",
  always: "Transcribes even during games.",
  paused: "Records only. Nothing becomes searchable until you switch back.",
};

const row = (label, attrs, on, extra = "") =>
  `<div class="set"><span>${esc(label)}${extra}</span><input type="checkbox" class="switch" ${attrs} ${on ? "checked" : ""}></div>`;

function show(s) {
  if (s.error) return;
  $("rec").checked = !s.paused;
  $("hotkey").textContent = s.paused ? "off (private mode)" : s.hotkey ? `pause: ${s.hotkey}` : "";

  // Apps: playing now (on) and excluded (off).
  const playing = [...new Set(s.streams.map(x => x.exe).filter(Boolean))].filter(e => !s.excluded_apps.includes(e));
  const apps = [...playing.map(e => [e, true]), ...s.excluded_apps.map(e => [e, false])];
  $("apps").innerHTML = apps.map(([e, on]) => row(name(e), `data-app="${esc(e)}"`, on, on ? ` <small>playing</small>` : "")).join("") ||
    `<p class="note">Nothing playing right now.</p>`;

  // Games: marked ones first, then other open apps.
  const games = [...s.games, ...s.running_apps.filter(e => !s.games.includes(e))];
  $("games").innerHTML = games.map(e =>
    row(name(e), `data-game="${esc(e)}"`, s.games.includes(e), s.game_running === e ? ` <small>running</small>` : "")).join("");

  const t = s.transcription;
  document.querySelectorAll('input[name="mode"]').forEach(r => { r.checked = r.value === t.mode; });
  $("mode-note").textContent = MODE_NOTES[t.mode] || "";
  const queue = s.queued_minutes >= 1 ? `${Math.round(s.queued_minutes)} min queued` : "up to date";
  $("tr-state").textContent = `${t.state} · ${queue}`;
  if (!typing($("limit"))) $("limit").value = s.gpu_busy_percent;
  $("gpu-now").textContent = `now ${s.gpu_3d_percent} %`;

  const sum = s.summary;
  $("sum-on").checked = sum.enabled;
  if (!typing($("sum-at"))) $("sum-at").value = sum.ask_at;
  if (!typing($("sum-words"))) $("sum-words").value = sum.max_words;
  const busy = /reading|writing|waiting|starting/.test(sum.state);
  $("sum-state").textContent = busy ? sum.state + "…" : ({ done: "today's done", skipped: "skipped today" }[sum.today_status] || "");
}

$("rec").addEventListener("change", e => post(e.target.checked ? "/resume" : "/pause"));
$("apps").addEventListener("change", e => {
  const app = e.target.dataset.app; if (!app) return;
  if (!e.target.checked && !confirm(`Stop recording ${name(app)} and delete everything recorded from it?`)) {
    e.target.checked = true;
    return;
  }
  post(`/${e.target.checked ? "include" : "exclude"}?app=${encodeURIComponent(app)}`);
});
const addForm = (form, input, confirmText, url) => $(form).addEventListener("submit", e => {
  e.preventDefault();
  let app = $(input).value.trim(); if (!app) return;
  if (!/\.[a-z0-9]+$/i.test(app)) app += ".exe";
  if (confirmText && !confirm(confirmText(app))) return;
  $(input).value = "";
  post(url(app));
});
addForm("add-app", "app-name", a => `Never record ${name(a)}, and delete everything recorded from it?`, a => `/exclude?app=${encodeURIComponent(a)}`);
addForm("add-game", "game-name", null, a => `/game?app=${encodeURIComponent(a)}`);
$("games").addEventListener("change", e => {
  const app = e.target.dataset.game; if (!app) return;
  post(`/${e.target.checked ? "game" : "not-game"}?app=${encodeURIComponent(app)}`);
});
document.querySelectorAll('input[name="mode"]').forEach(r =>
  r.addEventListener("change", () => post(`/transcription?mode=${r.value}`)));
$("limit").addEventListener("change", e => {
  const v = Math.round(+e.target.value);
  if (v >= 1 && v <= 100) post(`/api/gpu-limit?percent=${v}`);
});
const sumSet = q => post(`/api/summary-settings?${q}`);
$("sum-on").addEventListener("change", e => sumSet(`enabled=${e.target.checked ? 1 : 0}`));
$("sum-at").addEventListener("change", e => { if (e.target.value) sumSet(`ask_at=${encodeURIComponent(e.target.value)}`); });
$("sum-words").addEventListener("change", e => { const v = Math.round(+e.target.value); if (v >= 50) sumSet(`max_words=${v}`); });
$("sum-now").addEventListener("click", () => fetch("/summary?do=now", { method: "POST" }));
document.querySelectorAll("[data-open]").forEach(b =>
  b.addEventListener("click", () => fetch(`/api/open?what=${b.dataset.open}`, { method: "POST" })));

const refresh = async () => { if (!document.hidden) show(await (await fetch("/status")).json()); };
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
