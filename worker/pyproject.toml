[project]
name = "lifelog-worker"
version = "0.1.0"
description = "Transcribes lifelog's audio queue into the SQLite database"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "numpy",
    # CUDA 12 runtime libraries for CTranslate2 (no system-wide CUDA install needed).
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lifelog_worker"]
